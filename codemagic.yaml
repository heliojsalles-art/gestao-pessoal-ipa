workflows:
  ios-sideloadly-ipa:
    name: Gestão Pessoal iOS - IPA para Sideloadly
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 26.0
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_BUNDLE_ID: "com.helio.gestaopessoal"
        APP_ARTIFACT_NAME: "GestaoPessoal-sideloadly"

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - ~/Library/Developer/Xcode/DerivedData

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Show versions
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Install dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Ensure iOS project exists
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi

      - name: Generate native assets
        script: |
          npx capacitor-assets generate --ios

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build unsigned iPhone app
        script: |
          DERIVED_DATA="$CM_BUILD_DIR/build/DerivedData"

          xcodebuild build \
            -workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Fix framework bundle identifiers
        script: |
          DERIVED_DATA="$CM_BUILD_DIR/build/DerivedData"
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphoneos/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "App.app não encontrado em $APP_PATH"
            find "$DERIVED_DATA" -maxdepth 6 -type d -name "*.app" || true
            exit 1
          fi

          echo "App encontrado em: $APP_PATH"
          ls -la "$APP_PATH/Frameworks" || true
          echo "Corrigindo bundle identifiers dos frameworks..."

          for framework in "$APP_PATH"/Frameworks/*.framework; do
            PLIST="$framework/Info.plist"

            if [ -f "$PLIST" ]; then
              NAME=$(basename "$framework" .framework)
              NEW_ID="$APP_BUNDLE_ID.$NAME"

              echo "Ajustando $NAME -> $NEW_ID"

              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $NEW_ID" "$PLIST" || true
              /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" || true
            fi
          done

      - name: Package unsigned IPA for Sideloadly
        script: |
          DERIVED_DATA="$CM_BUILD_DIR/build/DerivedData"
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphoneos/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "App.app não encontrado em $APP_PATH"
            find "$DERIVED_DATA" -maxdepth 6 -type d -name "*.app" || true
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/build/Payload"
          mkdir -p "$CM_BUILD_DIR/build/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/Payload/App.app"

          cd "$CM_BUILD_DIR/build"
          /usr/bin/zip -qry "$APP_ARTIFACT_NAME.ipa" Payload
          ls -lh "$APP_ARTIFACT_NAME.ipa"

    artifacts:
      - build/*.ipa
      - build/DerivedData/Build/**/*.app
      - build/DerivedData/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log

  ios-simulator-unsigned:
    name: Gestão Pessoal iOS - Simulador sem assinatura
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 26.0
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Ensure iOS project exists
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi

      - name: Generate native assets
        script: |
          npx capacitor-assets generate --ios

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build simulator .app
        script: |
          xcodebuild build \
            -workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
